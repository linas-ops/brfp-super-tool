<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversor de Tabelas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="comum/brfp.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="topo">
      <div class="marca" title="Conversor de Tabelas">
        <span class="marca-ic"></span>
        <span class="marca-txt">Conversor de Tabelas</span>
        <span class="marca-versao" id="versao"></span>
      </div>
      <nav id="menus" aria-label="Menu principal"></nav>
      <div class="titulo-centro" id="titulo"></div>
      <div class="topo-acoes">
        <button id="btn-converter" class="btn-primario" title="Converter as tabelas marcadas (Ctrl+Enter)" disabled>
          <span id="btn-converter-ic"></span><span id="btn-converter-txt">Converter</span><span id="contador" class="contador" hidden>0</span>
        </button>
      </div>
    </header>

    <aside id="painel-esq" class="painel" aria-label="Tabelas de origem">
      <div class="painel-cab">
        <h2>Tabelas de origem</h2>
        <div class="painel-cab-acoes">
          <button id="btn-todas" class="btn-icone peq" title="Marcar todas as que aparecem na lista"></button>
          <button id="btn-nenhuma" class="btn-icone peq" title="Desmarcar todas"></button>
        </div>
      </div>
      <div class="busca-linha">
        <label class="campo-busca">
          <span id="busca-ic"></span>
          <input id="busca" type="search" placeholder="Buscar tabela…" autocomplete="off" spellcheck="false">
        </label>
        <select id="filtro" class="seletor" title="Filtrar a lista">
          <option value="tudo">Todas</option>
          <option value="sel">Marcadas</option>
          <option value="ambos">Nos dois jogos</option>
          <option value="so">Só na origem</option>
        </select>
      </div>
      <div id="lista" class="arvore" aria-label="Tabelas"></div>
      <div class="painel-rodape"><span id="resumo-lista"></span></div>
    </aside>
    <div class="divisor" id="div-esq"></div>

    <main id="conteudo" class="conteudo">
      <div class="conteudo-interno" id="principal"></div>
    </main>
    <div class="divisor" id="div-dir"></div>

    <aside id="painel-dir" class="painel" aria-label="Origem, destino e saída">
      <div id="propriedades" class="propriedades"></div>
    </aside>

    <footer id="status">
      <span class="status-esq contagem" id="status-esq"></span>
      <span class="status-dir" id="status-dir"></span>
    </footer>
  </div>
  <div id="camada-modal"></div>
  <div id="menu-contexto" class="menu-flutuante" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>

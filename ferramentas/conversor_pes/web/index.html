<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversor PES → FC</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="comum/brfp.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="topo">
      <div class="marca" title="Conversor de estádios PES 2021 → EA FC 26">
        <span class="marca-ic"></span>
        <span class="marca-txt">Conversor PES → FC</span>
        <span class="marca-versao" id="versao"></span>
      </div>
      <nav id="menus" aria-label="Menu principal"></nav>
      <div class="titulo-centro" id="titulo"></div>
      <div class="topo-acoes">
        <button id="btn-parar" class="btn-fantasma" hidden></button>
        <button id="btn-executar" class="btn-primario" title="Rodar todas as etapas da configuração selecionada" disabled>
          <span id="btn-executar-ic"></span><span id="btn-executar-txt">Converter</span>
        </button>
      </div>
    </header>

    <aside id="painel-esq" class="painel" aria-label="Configurações">
      <div class="painel-cab">
        <h2>Conversões</h2>
        <div class="painel-cab-acoes">
          <button id="btn-pasta-configs" class="btn-icone peq" title="Abrir a pasta das configurações"></button>
          <button id="btn-recarregar" class="btn-icone peq" title="Recarregar a lista"></button>
        </div>
      </div>
      <div id="lista-configs" class="arvore"></div>
      <div class="painel-rodape"><span id="rodape-esq" class="mudo"></span></div>
    </aside>
    <div class="divisor" id="div-esq"></div>

    <main id="conteudo" class="conteudo">
      <div class="conteudo-interno" id="principal"></div>
    </main>
    <div class="divisor" id="div-dir"></div>

    <aside id="painel-dir" class="painel" aria-label="Detalhes">
      <div id="propriedades" class="propriedades"></div>
    </aside>

    <footer id="status">
      <span class="status-esq" id="status-esq"></span>
      <span class="status-dir" id="status-dir"></span>
    </footer>
  </div>
  <div id="camada-modal"></div>
  <div id="menu-contexto" class="menu-flutuante" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criador de Ligas e Times</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="comum/brfp.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="topo">
      <div class="marca" title="Criador de Ligas e Times">
        <span class="marca-ic"></span>
        <span class="marca-txt">Criador de Ligas e Times</span>
        <span class="marca-versao" id="versao"></span>
      </div>
      <nav id="menus" aria-label="Menu principal"></nav>
      <div class="titulo-centro" id="titulo"></div>
      <div class="topo-acoes">
        <button id="btn-coletar" class="btn" title="Buscar na API os dados dos times que ainda não têm"></button>
        <button id="btn-gerar" class="btn-primario" title="Gravar o banco novo com tudo o que está no projeto (Ctrl+Enter)" disabled></button>
      </div>
    </header>

    <aside id="painel-esq" class="painel" aria-label="API-Football e projeto">
      <div class="abas-painel" id="abas-esq"></div>
      <div id="esq-api" class="esq-corpo"></div>
      <div id="esq-projeto" class="esq-corpo" hidden></div>
      <div id="esq-atualizar" class="esq-corpo" hidden></div>
    </aside>
    <div class="divisor" id="div-esq"></div>

    <main id="conteudo" class="conteudo">
      <div class="conteudo-interno" id="principal"></div>
    </main>
    <div class="divisor" id="div-dir"></div>

    <aside id="painel-dir" class="painel" aria-label="Opções">
      <div id="propriedades" class="propriedades"></div>
    </aside>

    <footer id="status">
      <span class="status-esq contagem" id="status-esq"></span>
      <span class="status-dir" id="status-dir"></span>
    </footer>
  </div>
  <div id="camada-modal"></div>
  <div id="menu-contexto" class="menu-flutuante" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>

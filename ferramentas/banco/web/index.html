<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor de Banco</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="comum/brfp.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header id="topo">
      <div class="marca" title="Editor de Banco — times, jogadores, ligas e tabelas do banco do jogo">
        <span class="marca-ic"></span>
        <span class="marca-txt">Editor de Banco</span>
        <span class="marca-versao" id="versao"></span>
      </div>
      <nav id="menus" aria-label="Menu principal"></nav>
      <div class="titulo-centro" id="titulo"></div>
      <div class="topo-acoes">
        <button id="btn-voltar" class="btn-fantasma" title="Voltar para a tela anterior (Alt+← ou Backspace)" disabled></button>
        <button id="btn-desfazer" class="btn-fantasma" title="Desfazer a última operação (Ctrl+Z)" disabled></button>
        <button id="btn-gravar" class="btn-primario" title="Gravar um banco novo com as mudanças (o original não muda)" disabled>
          <span id="btn-gravar-ic"></span><span id="btn-gravar-txt">Gravar banco</span>
        </button>
      </div>
    </header>

    <aside id="painel-esq" class="painel" aria-label="Navegação">
      <nav class="abas-painel" id="abas-esq"></nav>
      <div id="esq" class="esq-corpo"></div>
    </aside>
    <div class="divisor" id="div-esq"></div>

    <main id="conteudo" class="conteudo">
      <div class="conteudo-interno" id="principal"></div>
    </main>
    <div class="divisor" id="div-dir"></div>

    <aside id="painel-dir" class="painel" aria-label="Mudanças">
      <div id="propriedades" class="propriedades"></div>
    </aside>

    <footer id="status">
      <span class="status-esq" id="status-esq"></span>
      <span class="status-dir" id="status-dir"></span>
    </footer>
  </div>
  <div id="camada-modal"></div>
  <div id="menu-contexto" class="menu-flutuante" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
